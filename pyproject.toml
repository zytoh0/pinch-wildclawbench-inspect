[project]
name = "pinch-wildclawbench-inspect"
version = "0.1.0"
description = "PinchBench and WildClawBench evaluations for Inspect AI as a standalone package"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "inspect_ai>=0.3",
    "fabric>=3.2.2",
    "paramiko>=3.5.1",
    "pyyaml>=6.0.2",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "pypdf>=5.1.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pinchbench", "src/wildclawbench", "src/_openai_compatible_proxy.py"]

[tool.pytest.ini_options]
pythonpath = ["src"]
