[project]
name = "pinch-wildclawbench-inspect"
version = "0.1.0"
description = "PinchBench and WildClawBench evaluations for Inspect AI as a standalone package"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "inspect_ai==0.3.243",
    "fabric==3.2.3",
    "paramiko==5.0.0",
    "pyyaml==6.0.3",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.1",
    "pypdf==6.14.2",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.20",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pinchbench", "src/wildclawbench", "src/_openai_compatible_proxy.py"]

[tool.pytest.ini_options]
pythonpath = ["src"]
